# Precompute with qwen_image21_embedding.yaml using the same condition settings.
model:
  model_path: /path/to/Qwen-Image-2.1/transformer
  config_path: /path/to/Qwen-Image-2.1/transformer/config.json
  condition_model_path: /path/to/Qwen-Image-2.1
  condition_model_cfg:
    height: 512
    width: 512
    training_recipe: diffsynth
    enable_edit: false
    image_resize_mode: center_crop
    text_encoder_attn_implementation: sdpa
    text_encoder_dtype: bfloat16
    vae_dtype: float32
  ops_implementation:
    attn_implementation: sdpa
    rotary_pos_emb_implementation: eager
    rms_norm_implementation: eager
    swiglu_mlp_implementation: eager
    cross_entropy_loss_implementation: eager
    load_balancing_loss_implementation: eager
    moe_implementation: eager
  optimizer:
    type: adamw
    lr: 1.0e-5
    lr_warmup_ratio: 0.0
    lr_decay_style: constant
    weight_decay: 0.01
    max_grad_norm: 1.0
  accelerator:
    init_device: meta
    ulysses_size: 1
    gradient_checkpointing:
      enable: true
    fsdp_config:
      fsdp_mode: fsdp2
      mixed_precision:
        enable: true
        param_dtype: bfloat16
        reduce_dtype: float32
        cast_forward_inputs: false

data:
  train_path: output/qwen_image21_embedding
  data_type: diffusion
  source_name: Qwen-Image-2.1
  data_transform: dit_offline
  datasets_type: iterable
  text_keys: text
  log_sample: false
  dataloader:
    type: native
    num_workers: 0
    drop_last: true

train:
  training_task: offline_training
  global_batch_size: 8
  micro_batch_size: 1
  dyn_bsz: false
  seed: 42
  num_train_epochs: 1
  max_steps: 100
  # Enable with --train.profile.enable true; capture steps [5, 7).
  profile:
    enable: false
    start_step: 5
    end_step: 7
    trace_dir: output/qwen_image21_offline/profile
    record_shapes: true
    profile_memory: true
    with_stack: false
    with_modules: false
    rank0_only: true

  checkpoint:
    output_dir: output/qwen_image21_offline
    save_epochs: 1
    save_hf_weights: true
  wandb:
    enable: false
